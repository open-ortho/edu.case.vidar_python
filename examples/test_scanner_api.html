<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFD9010 Scanner Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .config-section label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 13px;
        }

        .config-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .download-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .device-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .device-info h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .device-info table {
            width: 100%;
            border-collapse: collapse;
        }

        .device-info td {
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
        }

        .device-info td:first-child {
            font-weight: 600;
            color: #555;
            width: 40%;
        }

        .device-info td:last-child {
            color: #333;
        }

        .scan-result {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .scan-result img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 15px;
        }

        .scan-result h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>?? BFD9010 Scanner Control</h1>
        <p class="subtitle">FHIR API Interface for Vidar Film Scanner</p>

        <!-- Configuration Section -->
        <div class="config-section">
            <label for="apiUrl">API Server URL:</label>
            <input type="text" id="apiUrl" value="http://localhost:5000" placeholder="http://localhost:5000">
            
            <label for="deviceId">Device ID:</label>
            <input type="text" id="deviceId" value="scanner-001" placeholder="scanner-001">
        </div>

        <!-- Download Link -->
        <div class="button-group">
            <button class="download-btn" onclick="downloadInstaller()">
                ?? Download Scanner Software
            </button>
        </div>

        <!-- Status Messages -->
        <div id="status" class="status"></div>

        <!-- Control Buttons -->
        <div class="button-group">
            <button onclick="getDeviceInfo()">
                ?? Device Info
            </button>
            <button onclick="performScan()">
                ?? Scan
            </button>
            <button onclick="calibrate()">
                ?? Calibrate
            </button>
            <button onclick="eject()">
                ?? Eject Film
            </button>
        </div>

        <!-- Device Information Display -->
        <div id="deviceInfo" class="device-info"></div>

        <!-- Scan Result Display -->
        <div id="scanResult" class="scan-result"></div>
    </div>

    <script>
        const API_BASE = () => document.getElementById('apiUrl').value;
        const DEVICE_ID = () => document.getElementById('deviceId').value;

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }

        function showLoading(button) {
            button.disabled = true;
            button.innerHTML += '<span class="spinner"></span>';
        }

        function hideLoading() {
            document.querySelectorAll('button').forEach(btn => {
                btn.disabled = false;
                btn.querySelector('.spinner')?.remove();
            });
        }

        function downloadInstaller() {
            showStatus('Downloading latest scanner software...', 'info');
            // Replace with your actual download URL or GitHub release URL
            const downloadUrl = 'https://github.com/open-ortho/edu.case.BFD9010/releases/latest';
            window.open(downloadUrl, '_blank');
            showStatus('Opening download page in new tab', 'success');
        }

        async function getDeviceInfo() {
            const button = event.target;
            showLoading(button);
            showStatus('Fetching device information...', 'info');
            document.getElementById('deviceInfo').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE()}/Device/${DEVICE_ID()}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/fhir+json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const device = await response.json();
                displayDeviceInfo(device);
                showStatus('Device information retrieved successfully', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error('Device info error:', error);
            } finally {
                hideLoading();
            }
        }

        function displayDeviceInfo(device) {
            const infoDiv = document.getElementById('deviceInfo');
            
            let html = '<h3>Scanner Device Information</h3><table>';
            html += `<tr><td>Manufacturer:</td><td>${device.manufacturer || 'N/A'}</td></tr>`;
            html += `<tr><td>Model:</td><td>${device.modelNumber || 'N/A'}</td></tr>`;
            html += `<tr><td>Serial Number:</td><td>${device.serialNumber || 'N/A'}</td></tr>`;
            
            // Display version information
            if (device.version && device.version.length > 0) {
                device.version.forEach(v => {
                    const type = v.type?.text || 'Version';
                    html += `<tr><td>${type}:</td><td>${v.value || 'N/A'}</td></tr>`;
                });
            }
            
            // Display properties
            if (device.property && device.property.length > 0) {
                html += '<tr><td colspan="2"><strong>Properties:</strong></td></tr>';
                device.property.forEach(prop => {
                    const name = prop.type?.text || 'Property';
                    let value = 'N/A';
                    
                    if (prop.valueQuantity) {
                        value = `${prop.valueQuantity.value} ${prop.valueQuantity.unit || ''}`;
                    } else if (prop.valueCodeableConcept) {
                        value = prop.valueCodeableConcept.text || 'N/A';
                    }
                    
                    html += `<tr><td>${name}:</td><td>${value}</td></tr>`;
                });
            }
            
            html += '</table>';
            infoDiv.innerHTML = html;
            infoDiv.style.display = 'block';
        }

        async function performScan() {
            const button = event.target;
            showLoading(button);
            showStatus('Starting scan operation... Please wait.', 'info');
            document.getElementById('scanResult').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE()}/Device/${DEVICE_ID()}/$scan`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const bundle = await response.json();
                
                if (!response.ok) {
                    // Extract error message from OperationOutcome
                    const outcome = bundle.entry?.find(e => e.resource?.resourceType === 'OperationOutcome');
                    const errorMsg = outcome?.resource?.issue?.[0]?.details?.text || 'Scan failed';
                    throw new Error(errorMsg);
                }

                // Find Binary resource with image data
                const binaryEntry = bundle.entry?.find(e => e.resource?.resourceType === 'Binary');
                const outcomeEntry = bundle.entry?.find(e => e.resource?.resourceType === 'OperationOutcome');
                
                if (binaryEntry && binaryEntry.resource.data) {
                    displayScanResult(binaryEntry.resource);
                    const message = outcomeEntry?.resource?.issue?.[0]?.details?.text || 'Scan completed successfully';
                    showStatus(message, 'success');
                } else {
                    throw new Error('No image data returned from scan');
                }
            } catch (error) {
                showStatus(`Scan Error: ${error.message}`, 'error');
                console.error('Scan error:', error);
            } finally {
                hideLoading();
            }
        }

        function displayScanResult(binary) {
            const resultDiv = document.getElementById('scanResult');
            
            // Convert base64 to data URL
            const imageData = `data:${binary.contentType};base64,${binary.data}`;
            
            let html = '<h3>Scan Result</h3>';
            html += `<img src="${imageData}" alt="Scanned Image">`;
            html += `<p style="margin-top: 10px; color: #666; font-size: 13px;">Content Type: ${binary.contentType}</p>`;
            html += `<button onclick="downloadImage('${imageData}')" style="margin-top: 15px;">?? Download Image</button>`;
            
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        function downloadImage(dataUrl) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `scan_${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showStatus('Image downloaded successfully', 'success');
        }

        async function calibrate() {
            const button = event.target;
            showLoading(button);
            showStatus('Starting calibration... Please wait.', 'info');

            try {
                const response = await fetch(`${API_BASE()}/Device/${DEVICE_ID()}/$calibrate`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const outcome = await response.json();
                
                const message = outcome.issue?.[0]?.details?.text || 'Operation completed';
                const isError = outcome.issue?.[0]?.severity === 'error';
                
                showStatus(message, isError ? 'error' : 'success');
            } catch (error) {
                showStatus(`Calibration Error: ${error.message}`, 'error');
                console.error('Calibration error:', error);
            } finally {
                hideLoading();
            }
        }

        async function eject() {
            const button = event.target;
            showLoading(button);
            showStatus('Ejecting film... Please wait.', 'info');

            try {
                const response = await fetch(`${API_BASE()}/Device/${DEVICE_ID()}/$eject`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const outcome = await response.json();
                
                const message = outcome.issue?.[0]?.details?.text || 'Operation completed';
                const isError = outcome.issue?.[0]?.severity === 'error';
                
                showStatus(message, isError ? 'error' : 'success');
            } catch (error) {
                showStatus(`Eject Error: ${error.message}`, 'error');
                console.error('Eject error:', error);
            } finally {
                hideLoading();
            }
        }

        // Test connection on page load
        window.addEventListener('load', () => {
            showStatus('Ready to connect. Click "Device Info" to test connection.', 'info');
        });
    </script>
</body>
</html>
