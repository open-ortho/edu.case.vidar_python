<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFD9000 Scanner Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           
            min-height: 100vh;
            padding: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .config-section label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 13px;
        }

        .label-with-help {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .help-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e9ecef;
            color: #495057;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            cursor: help;
            position: relative;
        }

        .help-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #f9fafb;
            padding: 10px 12px;
            border-radius: 6px;
            white-space: pre-line;
            font-size: 12px;
            line-height: 1.4;
            min-width: 220px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .help-icon::before {
            content: '';
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #1f2937 transparent transparent transparent;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .help-icon:hover::after,
        .help-icon:hover::before {
            opacity: 1;
        }

        .config-section input,
        .config-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .device-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .device-info h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .device-info table {
            width: 100%;
            border-collapse: collapse;
        }

        .device-info td {
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
        }

        .device-info td:first-child {
            font-weight: 600;
            color: #555;
            width: 40%;
        }

        .device-info td:last-child {
            color: #333;
        }

        .scan-result {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .scan-result img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 15px;
        }

        .scan-result h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BFD9000 Scanner Control</h1>
        <p class="subtitle">FHIR API Interface for Vidar Film Scanner</p>

        <!-- Configuration Section -->
        <div class="config-section">
            <div class="label-with-help">
                <label for="subjectId">Subject ID:</label>
                <span class="help-icon" id="subjectIdHelp" data-tooltip="">?</span>
            </div>
            <input type="text" id="subjectId" placeholder="B0001 / R001 / L12345678" oninput="updateFilenamePreview()">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="ageYears">Age (Years):</label>
                    <input type="number" id="ageYears" min="0" max="150" placeholder="25" oninput="updateFilenamePreview()">
                </div>
                <div style="flex: 1;">
                    <label for="ageMonths">Age (Months):</label>
                    <input type="number" id="ageMonths" min="0" max="11" placeholder="6" oninput="updateFilenamePreview()">
                </div>
            </div>
            
            <label for="imageType">Image Type:</label>
            <select id="imageType" onchange="updateFilenamePreview()">
                <option value="L">Lateral</option>
                <option value="F">Frontal</option>
                <option value="CS">Chest & Shoulder</option>
                <option value="E">Elbow</option>
                <option value="FA">Foot & Ankle</option>
                <option value="H">Hand & Wrist</option>
                <option value="K">Knee</option>
                <option value="P">Pelvis</option>
            </select>
            
            <label for="sex">Sex:</label>
            <select id="sex" onchange="updateFilenamePreview()">
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>
        </div>

        <!-- Filename Preview -->
        <div id="filenamePreview" style="margin-bottom: 15px; font-size: 14px; font-weight: 600; color: #dc3545;">
            Please enter a Subject ID
        </div>

        <!-- Status Messages -->
        <div id="status" class="status"></div>

        <!-- Control Buttons -->
        <div class="button-group">
            <button onclick="downloadInstaller()" class="download-btn full-width">
                Download BFD9010
            </button>
            <button onclick="getDeviceInfo()">
                Device Info
            </button>
            <button onclick="performScan()">
                Scan
            </button>
            <button onclick="calibrate()">
                Calibrate
            </button>
            <button onclick="eject()">
                Eject Film
            </button>
        </div>

        <!-- Device Information Display -->
        <div id="deviceInfo" class="device-info"></div>

        <!-- Scan Result Display -->
        <div id="scanResult" class="scan-result"></div>
    </div>

    <script>
        // Hardcoded values
        const API_BASE = "http://localhost:5000";
        const DEVICE_ID = "scanner-001";

        const ALLOWED_SUBJECT_ID_TYPES = [
            {
                label: 'B####',
                regex: /^B\d{4}$/,
                min: 1,
                max: 5887,
                description: 'Bolton Collection (B0001-B5887)'
            },
            {
                label: 'R###',
                regex: /^R\d{3}$/,
                min: 1,
                max: 99,
                description: 'Richardson Collection (R001-R099)'
            },
            {
                label: 'L########',
                regex: /^L\d{8}$/,
                description: 'Lancaster Collection (L followed by 8 digits)'
            }
        ];

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }

        function showLoading(button) {
            button.disabled = true;
            button.innerHTML += '<span class="spinner"></span>';
        }

        function hideLoading() {
            document.querySelectorAll('button').forEach(btn => {
                btn.disabled = false;
                btn.querySelector('.spinner')?.remove();
            });
        }

        function downloadInstaller() {
            showStatus('Downloading BFD9010...', 'info');
            // Download the ZIP file directly
            const downloadUrl = 'https://wingate.case.edu/static/bfd9010/bfd9010_gui_latest.zip';
            
            // Create a temporary link element to trigger download
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'bfd9010_gui_latest.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatus('Download started', 'success');
        }

        function getSubjectIdHelpText() {
            const lines = ['Allowed Subject IDs:'];
            ALLOWED_SUBJECT_ID_TYPES.forEach(type => {
                lines.push(`- ${type.label}: ${type.description}`);
            });
            return lines.join('\n');
        }

        function getSubjectIdValidation(subjectId) {
            if (!subjectId) {
                return { isValid: false, message: 'Please enter a Subject ID' };
            }

            for (const type of ALLOWED_SUBJECT_ID_TYPES) {
                if (type.regex.test(subjectId)) {
                    if (typeof type.min === 'number' && typeof type.max === 'number') {
                        const subjectNumber = parseInt(subjectId.substring(1), 10);
                        if (subjectNumber < type.min || subjectNumber > type.max) {
                            return {
                                isValid: false,
                                message: `${type.description} only`
                            };
                        }
                    }

                    return { isValid: true, message: '' };
                }
            }

            return {
                isValid: false,
                message: 'Subject ID must match an allowed format'
            };
        }

        async function getDeviceInfo() {
            const button = event.target;
            showLoading(button);
            showStatus('Fetching device information...', 'info');
            document.getElementById('deviceInfo').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/Device/${DEVICE_ID}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/fhir+json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const device = await response.json();
                displayDeviceInfo(device);
                showStatus('Device information retrieved successfully', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error('Device info error:', error);
            } finally {
                hideLoading();
            }
        }

        function displayDeviceInfo(device) {
            const infoDiv = document.getElementById('deviceInfo');
            
            let html = '<h3>Scanner Device Information</h3><table>';
            html += `<tr><td>Manufacturer:</td><td>${device.manufacturer || 'N/A'}</td></tr>`;
            html += `<tr><td>Model:</td><td>${device.modelNumber || 'N/A'}</td></tr>`;
            html += `<tr><td>Serial Number:</td><td>${device.serialNumber || 'N/A'}</td></tr>`;
            
            // Display version
            // Display version information
            if (device.version && device.version.length > 0) {
                device.version.forEach(v => {
                    const type = v.type?.text || 'Version';
                    html += `<tr><td>${type}:</td><td>${v.value || 'N/A'}</td></tr>`;
                });
            }
            
            // Display properties
            if (device.property && device.property.length > 0) {
                html += '<tr><td colspan="2"><strong>Properties:</strong></td></tr>';
                device.property.forEach(prop => {
                    const name = prop.type?.text || 'Property';
                    let value = 'N/A';
                    
                    if (prop.valueQuantity) {
                        value = `${prop.valueQuantity.value} ${prop.valueQuantity.unit || ''}`;
                    } else if (prop.valueCodeableConcept) {
                        value = prop.valueCodeableConcept.text || 'N/A';
                    }
                    
                    html += `<tr><td>${name}:</td><td>${value}</td></tr>`;
                });
            }
            
            html += '</table>';
            infoDiv.innerHTML = html;
            infoDiv.style.display = 'block';
        }

        async function performScan() {
            const button = event.target;
            showLoading(button);
            showStatus('Starting scan operation... Please wait.', 'info');
            document.getElementById('scanResult').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/Device/${DEVICE_ID}/$scan`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const bundle = await response.json();
                
                if (!response.ok) {
                    // Extract error message from OperationOutcome
                    const outcome = bundle.entry?.find(e => e.resource?.resourceType === 'OperationOutcome');
                    const errorMsg = outcome?.resource?.issue?.[0]?.details?.text || 'Scan failed';
                    throw new Error(errorMsg);
                }

                // Find Binary resource with image data
                const binaryEntry = bundle.entry?.find(e => e.resource?.resourceType === 'Binary');
                const outcomeEntry = bundle.entry?.find(e => e.resource?.resourceType === 'OperationOutcome');
                
                if (binaryEntry && binaryEntry.resource.data) {
                    displayScanResult(binaryEntry.resource);
                    const message = outcomeEntry?.resource?.issue?.[0]?.details?.text || 'Scan completed successfully';
                    showStatus(message, 'success');
                } else {
                    throw new Error('No image data returned from scan');
                }
            } catch (error) {
                showStatus(`Scan Error: ${error.message}`, 'error');
                console.error('Scan error:', error);
            } finally {
                hideLoading();
            }
        }

        function displayScanResult(binary) {
            const resultDiv = document.getElementById('scanResult');
            
            // Convert base64 to data URL
            const imageData = `data:${binary.contentType};base64,${binary.data}`;
            
            let html = '<h3>Scan Result</h3>';
            html += `<img src="${imageData}" alt="Scanned Image">`;
            html += `<p style="margin-top: 10px; color: #666; font-size: 14px;">Image captured successfully</p>`;
            html += `<button onclick="downloadImage('${imageData}')" style="margin-top: 15px;">Download Image</button>`;
            
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        function generateFilename() {
            const subjectId = document.getElementById('subjectId').value;
            const imageType = document.getElementById('imageType').value;
            const sex = document.getElementById('sex').value;
            const years = parseInt(document.getElementById('ageYears').value) || 0;
            const months = parseInt(document.getElementById('ageMonths').value) || 0;
            
            const validation = getSubjectIdValidation(subjectId);
            if (!validation.isValid) {
                return null;
            }
            
            // Format filename according to pattern: <SubjectID><ImageType><Sex><Years>y<Months>m.png
            const yearsStr = years.toString().padStart(2, '0');
            const monthsStr = months.toString().padStart(2, '0');
            return `${subjectId}${imageType}${sex}${yearsStr}y${monthsStr}m.png`;
        }

        function updateFilenamePreview() {
            const subjectId = document.getElementById('subjectId').value;
            const filename = generateFilename();
            const previewElement = document.getElementById('filenamePreview');
            
            if (!subjectId) {
                previewElement.textContent = 'Please enter a Subject ID';
                previewElement.style.color = '#dc3545';
                return;
            }

            const validation = getSubjectIdValidation(subjectId);
            if (!validation.isValid) {
                previewElement.textContent = validation.message || 'Subject ID is invalid';
                previewElement.style.color = '#dc3545';
                return;
            }
            
            if (filename) {
                const isValid = validateFilename(filename);
                previewElement.textContent = `Filename: ${filename} ${isValid ? '✓' : '✗'}`;
                previewElement.style.color = isValid ? '#28a745' : '#dc3545';
            } else {
                previewElement.textContent = 'Please complete all required fields';
                previewElement.style.color = '#dc3545';
            }
        }

        function validateFilename(filename) {
            // Remove .png extension for validation
            const baseFilename = filename.replace('.png', '');
            // Regex pattern: ^(?P<patient_id>(B\d{4}|R\d{3}|L\d{8}))(?P<image_type>[A-Z0-9]+)(?P<sex>[MFOU])(?P<years>\d{2,3})y(?P<months>\d{2})m$
            const regex = /^(B\d{4}|R\d{3}|L\d{8})([A-Z0-9]+)([MFOU])(\d{2,3})y(\d{2})m$/;
            return regex.test(baseFilename);
        }

        function downloadImage(dataUrl) {
            const subjectId = document.getElementById('subjectId').value;
            const filename = generateFilename();
            
            if (!subjectId) {
                showStatus('Please enter a Subject ID', 'error');
                return;
            }

            const validation = getSubjectIdValidation(subjectId);
            if (!validation.isValid) {
                showStatus(validation.message || 'Subject ID is invalid', 'error');
                return;
            }
            
            if (!filename) {
                showStatus('Please complete all required fields', 'error');
                return;
            }
            
            if (!validateFilename(filename)) {
                showStatus('Generated filename does not match required pattern', 'error');
                return;
            }
            
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showStatus(`Image downloaded as ${filename}`, 'success');
        }

        async function calibrate() {
            const button = event.target;
            showLoading(button);
            showStatus('Starting calibration... Please wait.', 'info');

            try {
                const response = await fetch(`${API_BASE}/Device/${DEVICE_ID}/$calibrate`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const outcome = await response.json();
                
                const message = outcome.issue?.[0]?.details?.text || 'Operation completed';
                const isError = outcome.issue?.[0]?.severity === 'error';
                
                showStatus(message, isError ? 'error' : 'success');
            } catch (error) {
                showStatus(`Calibration Error: ${error.message}`, 'error');
                console.error('Calibration error:', error);
            } finally {
                hideLoading();
            }
        }

        async function eject() {
            const button = event.target;
            showLoading(button);
            showStatus('Ejecting film... Please wait.', 'info');

            try {
                const response = await fetch(`${API_BASE}/Device/${DEVICE_ID}/$eject`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/fhir+json',
                        'Content-Type': 'application/fhir+json'
                    }
                });

                const outcome = await response.json();
                
                const message = outcome.issue?.[0]?.details?.text || 'Operation completed';
                const isError = outcome.issue?.[0]?.severity === 'error';
                
                showStatus(message, isError ? 'error' : 'success');
            } catch (error) {
                showStatus(`Eject Error: ${error.message}`, 'error');
                console.error('Eject error:', error);
            } finally {
                hideLoading();
            }
        }

        window.addEventListener('load', () => {
            const subjectIdHelp = document.getElementById('subjectIdHelp');
            if (subjectIdHelp) {
                subjectIdHelp.dataset.tooltip = getSubjectIdHelpText();
            }
            updateFilenamePreview();
        });
    </script>
</body>
</html>
