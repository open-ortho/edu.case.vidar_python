name: Build Release Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "BFD9010/Directory.Build.props")
          $version = $xml.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package (single-file)
        shell: cmd
        run: BFD9010\package.bat

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          name: Build v${{ steps.version.outputs.version }} (run ${{ github.run_number }})
          generate_release_notes: true
          files: |
            BFD9010/artifacts/*.zip
